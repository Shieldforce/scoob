; Opcache ajustado pra produção (o default de fábrica cabia só 10 mil arquivos
; em 128MB — um projeto Laravel com vendor passa de 20 mil .php e parte do código
; ficava fora do cache).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=65407
opcache.save_comments=1

; 0 = nunca checa se o arquivo mudou em disco: mais rápido, mas código novo só
; entra com "docker restart" do container (os scripts de deploy já fazem isso).
; Em desenvolvimento, subir o container com -e PHP_OPCACHE_VALIDATE_TIMESTAMPS=1.
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq=0

realpath_cache_size=4096K
realpath_cache_ttl=600
